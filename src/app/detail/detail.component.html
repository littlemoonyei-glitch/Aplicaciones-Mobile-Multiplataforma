<ActionBar [title]="book.title" class="action-bar">
  <NavigationButton text="Atrás" android.systemIcon="ic_menu_back" (tap)="goBack()"></NavigationButton>
</ActionBar>
<ScrollView><StackLayout class="detail">
  <Image [src]="book.cover" class="detail-cover" stretch="aspectFill"></Image>
  <Label [text]="book.title" class="title"></Label>
  <Label [text]="book.author + ' · ' + book.category" class="subtitle"></Label>
  <Label [text]="book.description" textWrap="true" class="description"></Label>
  <Button text="Guardar en favoritos" (tap)="save()" class="save"></Button>
</StackLayout></ScrollView>
