<ActionBar title="Mi biblioteca" class="action-bar">
  <ActionItem ios.position="right" android.position="actionBar" (tap)="animateRefresh()">
    <Label #refreshIcon text="&#xf2f1;" class="fa refresh-icon"></Label>
  </ActionItem>
</ActionBar>

<GridLayout rows="auto, auto, *" class="page">
  <StackLayout row="0" class="welcome">
    <Image src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=900" class="hero"></Image>
    <Label text="Encuentra tu próxima lectura" class="welcome-title"></Label>
  </StackLayout>

  <StackLayout row="1" class="search-area">
    <!-- Two-way binding y directiva de validación personalizada. -->
    <TextField [(ngModel)]="searchText" (ngModelChange)="filterBooks()" minCharacters="2"
      #search="ngModel" hint="Buscar por título o autor (mín. 2 letras)" class="search-field"></TextField>
    <Label *ngIf="search.invalid && searchText" text="Escribe al menos 2 caracteres para buscar." class="validation"></Label>
    <Label text="Doble toque aquí para limpiar la búsqueda" (doubleTap)="onDoubleTap()" class="gesture-hint"></Label>
  </StackLayout>

  <PullToRefresh row="2" (refresh)="refreshList($event)">
    <ListView [items]="visibleBooks" class="book-list" separatorColor="transparent">
      <ng-template let-book="item">
        <!-- Plantilla anidada con FlexboxLayout. -->
        <FlexboxLayout class="book-card" flexDirection="row" alignItems="center">
          <Image [src]="book.cover" class="cover" stretch="aspectFill" (tap)="openDetail(book)"></Image>
          <StackLayout class="book-data" (tap)="openDetail(book)">
            <Label [text]="book.title" class="book-title"></Label>
            <Label [text]="book.author" class="book-author"></Label>
            <Label [text]="book.category" class="category"></Label>
          </StackLayout>
          <Button text="Categoría" class="category-button" (tap)="chooseCategory(book)"></Button>
        </FlexboxLayout>
      </ng-template>
    </ListView>
  </PullToRefresh>
</GridLayout>
